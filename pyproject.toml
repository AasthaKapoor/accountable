[project]
name = "accountable"
version = "0.1.0"
description = "Accountable sales CRM backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "email-validator>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "accountable"
module-root = "backend"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
