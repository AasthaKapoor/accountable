<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline · Accountable · Option B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../mockup.css">
<style>
  /* Summary: Midnight panel with the board totals and the open value split by stage */
  .summary { background: var(--ink); color: var(--sea-mist); border-radius: 16px; padding: 22px 26px; margin-bottom: var(--gutter); display: grid; grid-template-columns: auto auto auto 1fr; gap: 40px; align-items: center; }
  .summary .label { color: rgba(205, 216, 219, 0.75); font-weight: 500; }
  .summary .value { font: 600 28px/1.2 var(--mono); color: #FFFFFF; letter-spacing: -0.02em; }
  .split { display: flex; gap: 4px; }
  .split div { height: 12px; border-radius: 999px; }
  .split-labels { display: flex; gap: 4px; margin-top: 8px; font-size: 12px; color: rgba(205, 216, 219, 0.75); }
  .split-labels span { white-space: nowrap; overflow: hidden; }

  .board-panel { padding: 14px; overflow-x: auto; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 12px; align-items: start; }

  /* Each column is tinted with its stage colour */
  .col { border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .col.new { background: rgba(17, 138, 178, 0.08); }
  .col.qualified { background: rgba(255, 193, 69, 0.12); }
  .col.proposal { background: rgba(247, 140, 107, 0.1); }
  .col.negotiation { background: rgba(7, 59, 76, 0.06); }
  .col.won { background: rgba(6, 214, 160, 0.09); }
  .col.lost { background: rgba(239, 71, 111, 0.07); }

  .col-head { padding: 6px 6px 8px; }
  .col-title { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; }
  .col-title .count-badge { background: var(--panel); color: var(--ink); }
  .col-value { font: 600 19px/1.3 var(--mono); margin-top: 6px; letter-spacing: -0.02em; }
  .col-exp { font-size: 12px; color: var(--ink-muted); }
  .col-exp .mono { color: var(--ink); }
  .col-closed { font-size: 12px; color: var(--ink-muted); margin-top: 6px; min-height: 42px; }

  .cards { display: flex; flex-direction: column; gap: 8px; max-height: 560px; overflow-y: auto; }
  .card { position: relative; background: var(--panel); border-radius: 10px; padding: 12px; box-shadow: 0 1px 3px rgba(7, 59, 76, 0.08); cursor: grab; }
  .card-value { font: 600 17px var(--mono); letter-spacing: -0.02em; }
  .card-name { font-weight: 500; margin-top: 4px; line-height: 1.3; }
  .card-org { color: var(--ink-muted); font-size: 12.5px; }
  .card-meter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font: 500 11.5px var(--mono); color: var(--ink-muted); }
  .card-meter .track { flex: 1; height: 5px; border-radius: 999px; background: var(--bg); overflow: hidden; }
  .card-meter .fill { height: 100%; border-radius: 999px; }
  .card-date { margin-top: 6px; font: 11.5px var(--mono); color: var(--ink-muted); }
  .card-date.late-text { color: var(--alert); }
  .card .tag-late { position: absolute; top: 10px; right: 10px; }

  .add-deal { display: flex; align-items: center; justify-content: center; gap: 6px; height: 34px; border-radius: 8px; color: var(--ink-muted); font-weight: 500; }
  .add-deal svg { width: 15px; height: 15px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="title-row">
      <h1>Pipeline</h1>
      <button class="btn btn-primary" id="new-deal"></button>
    </div>

    <section class="summary">
      <div><div class="label">Open value</div><div class="value" id="t-value"></div></div>
      <div><div class="label">Expected revenue</div><div class="value" id="t-expected"></div></div>
      <div><div class="label">Open deals</div><div class="value" id="t-count"></div></div>
      <div>
        <div class="split" id="split"></div>
        <div class="split-labels" id="split-labels"></div>
      </div>
    </section>

    <section class="panel board-panel">
      <div class="board" id="board"></div>
    </section>
  </main>
</div>

<script src="../data.js"></script>
<script>
  renderSidebar("pipeline");
  document.getElementById("new-deal").innerHTML = icon("plus") + "New deal";

  const open = openDeals();
  const t = totals(open);
  document.getElementById("t-value").textContent = fmtMoney(t.value);
  document.getElementById("t-expected").textContent = fmtMoney(t.expected);
  document.getElementById("t-count").textContent = open.length;

  const openStages = STAGES.filter((s) => s.open).map((s) => ({ ...s, v: totals(open.filter((d) => d.stage === s.key)).value }));
  const onDark = (k) => (k === "negotiation" ? "#CDD8DB" : STAGE_COLOUR[k]);
  document.getElementById("split").innerHTML = openStages.map((s) => `<div style="flex: ${s.v}; background: ${onDark(s.key)}"></div>`).join("");
  document.getElementById("split-labels").innerHTML = openStages.map((s) => `<span style="flex: ${s.v}">${s.name}</span>`).join("");

  function card(d) {
    const late = d.late ? '<span class="tag-late">Late</span>' : "";
    return `<div class="card">
      ${late}
      <div class="card-value">${fmtMoney(d.value)}</div>
      <div class="card-name">${d.name}</div>
      <div class="card-org">${d.org}</div>
      <div class="card-meter"><span class="track"><span class="fill" style="display: block; width: ${d.prob}%; background: ${STAGE_COLOUR[d.stage]}"></span></span>${d.prob}%</div>
      <div class="card-date ${d.late ? "late-text" : ""}">${d.late ? "Due " : ""}${fmtDate(d.close)}</div>
    </div>`;
  }

  document.getElementById("board").innerHTML = STAGES.map((s) => {
    const deals = DEALS.filter((d) => d.stage === s.key);
    const count = STAGE_COUNTS[s.key] ?? deals.length;
    const st = totals(deals);
    const figures = s.open
      ? `<div class="col-value">${fmtMoney(st.value)}</div><div class="col-exp"><span class="mono">${fmtMoney(st.expected)}</span> expected</div>`
      : `<div class="col-closed"></div>`;
    return `<div class="col ${s.key}">
      <div class="col-head">
        <div class="col-title"><span>${s.name}</span><span class="count-badge">${count}</span></div>
        ${figures}
      </div>
      <div class="cards">${deals.map(card).join("")}</div>
      <div class="add-deal">${icon("plus")}Add deal</div>
    </div>`;
  }).join("");
</script>
</body>
</html>
